{% extends "base.html" %}

{% block title %}Form - Add question{% endblock %}

{% block content %}
<h1>Add a question</h1>
{% if error_message %}
<p class="error_message">{{ error_message }</p>
{% endif %}
<form action="{% url 'polls:add' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Add">
</form>
{% endblock %}
